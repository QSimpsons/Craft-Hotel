<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedometer voorbeeld</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .banner {
      position: absolute;
      left: 50%;
      top: 2.5vh;
      transform: translateX(-50%);
      padding: 1vh 2vh;
      border-radius: 999px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1.5vh;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 5;
    }
  </style>
</head>
<body class="demo-mode">
  <div class="banner" id="banner">Voorbeeld laden…</div>
  <div id="speedo" class="speedo visible" aria-hidden="false">
    <div class="row">
      <button type="button" id="ind-handbrake" class="icon" tabindex="-1">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11.1 6.8h1.8v7.2h-1.8zm0 8.6h1.8V18h-1.8z" fill="currentColor"/></svg>
      </button>
      <button type="button" id="ind-left" class="icon" tabindex="-1">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.2 5.2 7 12l8.2 6.8V14h5.3V10H15.2V5.2z"/></svg>
      </button>
      <button type="button" id="ind-hazard" class="icon hazard" tabindex="-1">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3.2 2.4 20.8h19.2L12 3.2zm0 4.4 5.7 10.2H6.3L12 7.6z"/><path fill="currentColor" d="M11.15 11h1.7v4.2h-1.7zm0 5.1h1.7V18h-1.7z"/></svg>
      </button>
      <button type="button" id="ind-right" class="icon" tabindex="-1">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8.8 5.2 17 12l-8.2 6.8V14H3.5V10h5.3V5.2z"/></svg>
      </button>
      <div class="speed-wrap">
        <svg class="arcs" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="arc-track" cx="60" cy="60" r="48" />
          <circle id="arc" class="arc-fill" cx="60" cy="60" r="48" />
          <circle class="arc-track-inner" cx="60" cy="60" r="40" />
        </svg>
        <div class="speed-core">
          <div id="speed" class="speed">67</div>
          <div id="unit" class="unit">KM/H</div>
        </div>
      </div>
      <button type="button" id="ind-damage" class="icon status green" tabindex="-1">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8 2.2 20.6h19.6L12 2.8zm0 3.8 6.6 11.8H5.4L12 6.6z"/><path fill="currentColor" d="M11.15 10.2h1.7v4.3h-1.7zm0 5.2h1.7V17h-1.7z"/></svg>
      </button>
      <button type="button" id="ind-engine" class="icon status green" tabindex="-1">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 8V6h3v2h.8l1.7-1.7H17V9h1.5v1.6H20v2.2h-1.5V15H20v2.2h-1.5V20h-3.7L13 18.2H9.8V20H7.5v-1.8H5.2v-2.4H7V13H5.2v-2.4H7V9h1zm1.8 2.2v5.8h2.6l1.4 1.4h2.4v-1.6h-1.3l-1.5-1.5v-4.1h.9V9.8h-1.5l-1.2 1.4H9.8z"/></svg>
      </button>
      <button type="button" id="ind-lights" class="icon lights on" tabindex="-1">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 7.2c3.4 0 6.2 2.8 6.2 6.2S7.4 19.6 4 19.6V7.2zm8.4 1.3h8.2v1.6h-8.2zm0 3.5h8.2v1.6h-8.2zm0 3.5h8.2v1.6h-8.2z"/></svg>
      </button>
    </div>
  </div>
  <div id="demo" class="demo hidden"></div>
  <script>window.GetParentResourceName = () => 'mallorca-speedometer';</script>
  <script src="app.js"></script>
  <script>
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const banner = document.getElementById('banner');
    const send = (data) => window.dispatchEvent(new MessageEvent('message', { data: { action: 'update', data } }));

    (async () => {
      await sleep(400);
      banner.textContent = 'Normaal — zoals voorbeeld';
      send({ speed: 67, maxSpeed: 280, unit: 'km/h', engine: 'green', damage: 'green', left: false, right: false, hazard: false, handbrake: false, lights: true });
      await sleep(2200);

      banner.textContent = 'Links pinker';
      send({ speed: 54, maxSpeed: 280, unit: 'km/h', engine: 'green', damage: 'green', left: true, right: false, hazard: false, handbrake: false, lights: true });
      await sleep(1800);

      banner.textContent = 'Motor geel · schade geel';
      send({ speed: 88, maxSpeed: 280, unit: 'km/h', engine: 'yellow', damage: 'yellow', left: false, right: false, hazard: false, handbrake: false, lights: true });
      await sleep(1600);

      banner.textContent = 'Motor rood · noodknippers · handrem';
      send({ speed: 0, maxSpeed: 280, unit: 'km/h', engine: 'red', damage: 'red', left: true, right: true, hazard: true, handbrake: true, lights: true });
      await sleep(2500);
      banner.textContent = 'Klaar';
    })();
  </script>
</body>
</html>
