<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mallorca Speedometer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="speedo" class="speedo" aria-hidden="true">
    <div class="gauge">
      <svg class="gauge-ring" viewBox="0 0 220 220" aria-hidden="true">
        <defs>
          <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(255,196,92,0.35)" />
            <stop offset="100%" stop-color="rgba(255,87,34,0.25)" />
          </linearGradient>
          <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#26c6da" />
            <stop offset="55%" stop-color="#ffc45c" />
            <stop offset="100%" stop-color="#ff5734" />
          </linearGradient>
        </defs>
        <circle class="track" cx="110" cy="110" r="92" />
        <circle id="arc" class="arc" cx="110" cy="110" r="92" />
      </svg>

      <div class="gauge-core">
        <div id="speed" class="speed">0</div>
        <div id="unit" class="unit">km/h</div>
      </div>
    </div>

    <div class="indicators" role="group" aria-label="Voertuigindicatoren">
      <div id="ind-left" class="ind" title="Links">
        <svg viewBox="0 0 24 24"><path d="M14 6l-8 6 8 6V6zM18 6v12h2V6h-2z"/></svg>
      </div>

      <div id="ind-hazard" class="ind hazard" title="Noodknippers">
        <svg viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3zm0 4.5l6.2 11H5.8L12 7.5zM11 12h2v4h-2v-4zm0 5h2v2h-2v-2z"/></svg>
      </div>

      <div id="ind-right" class="ind" title="Rechts">
        <svg viewBox="0 0 24 24"><path d="M10 6l8 6-8 6V6zM4 6v12h2V6H4z"/></svg>
      </div>

      <div id="ind-engine" class="ind status green" title="Motor">
        <svg viewBox="0 0 24 24"><path d="M7 9V7h4v2h1l2-2h3v3h2v2h-2v2h2v2h-2v3h-3l-2-2H9v2H7v-2H5v-2h2v-2H5v-2h2V9zm2 2v6h3.2l1.5 1.5H17v-2h-1.5L14 15.2V11h1V9h-1.8L12 11H9z"/></svg>
        <span class="label">Motor</span>
      </div>

      <div id="ind-damage" class="ind status green" title="Schade">
        <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 4l7.5 13h-15L12 6zm-1 4h2v5h-2v-5zm0 6h2v2h-2v-2z"/></svg>
        <span class="label">Schade</span>
      </div>

      <div id="ind-handbrake" class="ind handbrake" title="Handrem">
        <svg viewBox="0 0 24 24"><path d="M8 4h8v2H8V4zm1 4h6l1 3h2v2h-1l-1.2 7H8.2L7 13H6v-2h2l1-3zm1.3 5l-.5 3h4.4l-.5-3H10.3z"/></svg>
        <span class="label">Handrem</span>
      </div>
    </div>

    <div class="bars">
      <div class="bar">
        <span>Motor</span>
        <div class="bar-track"><div id="engine-bar" class="bar-fill green"></div></div>
      </div>
      <div class="bar">
        <span>Carrosserie</span>
        <div class="bar-track"><div id="body-bar" class="bar-fill green"></div></div>
      </div>
    </div>
  </div>

  <!-- Browser-demo (alleen zichtbaar buiten FiveM) -->
  <div id="demo" class="demo hidden">
    <h1>Speedometer demo</h1>
    <p>Simuleer voertuigstatus voor preview</p>
    <label>Snelheid <input id="demo-speed" type="range" min="0" max="280" value="72" /></label>
    <label>Motor
      <select id="demo-engine">
        <option value="green">Groen</option>
        <option value="yellow">Geel</option>
        <option value="red">Rood</option>
      </select>
    </label>
    <label>Schade
      <select id="demo-damage">
        <option value="green">Groen</option>
        <option value="yellow">Geel</option>
        <option value="red">Rood</option>
      </select>
    </label>
    <div class="demo-toggles">
      <button type="button" data-toggle="left">Links</button>
      <button type="button" data-toggle="hazard">Noodknippers</button>
      <button type="button" data-toggle="right">Rechts</button>
      <button type="button" data-toggle="handbrake">Handrem</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
