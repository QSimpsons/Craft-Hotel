<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mallorca FPS Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="cliff"></div>
    <div class="sea"></div>
    <div class="palm"></div>
  </div>

  <header class="hud" id="hud" role="status" aria-label="Mallorca FPS panel">
    <div class="rail">
      <div class="group left">
        <article class="stat" data-key="fps">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2.1a6.9 6.9 0 1 1-6.9-6.9V3zm8.2 6.4-6.7 2.1 4.2-7.2a9 9 0 0 1 2.5 5.1z"/></svg>
          </span>
          <div class="copy">
            <strong id="val-fps">144</strong>
            <span>FPS</span>
          </div>
        </article>

        <article class="stat" data-key="ping">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 18h2v-4H5v4zm4 0h2V8H9v10zm4 0h2V4h-2v14zm4 0h2v-7h-2v7z"/></svg>
          </span>
          <div class="copy">
            <strong id="val-ping">24<span class="unit">ms</span></strong>
            <span>Ping</span>
          </div>
        </article>

        <article class="stat" data-key="id">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z"/></svg>
          </span>
          <div class="copy">
            <strong id="val-id">12</strong>
            <span>ID</span>
          </div>
        </article>

        <article class="stat" data-key="players">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8.5 12a3.5 3.5 0 1 0-3.5-3.5A3.5 3.5 0 0 0 8.5 12zm7 0A3.5 3.5 0 1 0 12 8.5 3.5 3.5 0 0 0 15.5 12zM8.5 14c-3 0-7 1.5-7 4.5V20h9.2a7.5 7.5 0 0 1-.2-1.5c0-1.6.6-3.1 1.7-4.3A10.4 10.4 0 0 0 8.5 14zm7 0c-.6 0-1.2 0-1.8.1A5.5 5.5 0 0 1 21 19.5V20h-8.2a5.5 5.5 0 0 0 2.7-6z"/></svg>
          </span>
          <div class="copy">
            <strong id="val-players">48<span class="unit">/128</span></strong>
            <span>Spelers</span>
          </div>
        </article>
      </div>

      <div class="crest" data-key="mallorca">
        <div class="crest-ring">
          <img src="logo.svg" alt="" />
        </div>
        <div class="crest-copy">
          <p class="name" id="val-server">Mallorca</p>
          <p class="tag" id="val-tagline">Islas Baleares</p>
        </div>
      </div>

      <div class="group right">
        <article class="stat" data-key="time">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm.8-13h-1.6v6l5.2 3.1.8-1.3-4.4-2.6z"/></svg>
          </span>
          <div class="copy">
            <strong id="val-time">19:43</strong>
            <span>Tijd</span>
          </div>
        </article>

        <article class="stat" data-key="voice">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>
          </span>
          <div class="copy">
            <strong id="val-voice">Normaal</strong>
            <span>Stem</span>
          </div>
        </article>

        <article class="stat" data-key="discord">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M19.3 5.2A17.4 17.4 0 0 0 15 4l-.4.8a16 16 0 0 1 4 1.6 16.4 16.4 0 0 0-13.2 0A16 16 0 0 1 9.4 4.8L9 4a17.4 17.4 0 0 0-4.3 1.2C1.4 10.1.6 14.8.8 19.4A17.6 17.6 0 0 0 6.4 21l.8-1.2a11.4 11.4 0 0 1-1.8-.9l.4-.3a12.6 12.6 0 0 0 12.4 0l.4.3a11.4 11.4 0 0 1-1.8.9l.8 1.2a17.6 17.6 0 0 0 5.6-1.6c.4-5.2-.6-9.8-3.9-14.2zM8.7 16.4c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2zm6.6 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2z"/></svg>
          </span>
          <div class="copy">
            <strong id="val-discord">discord.gg/mallorca</strong>
            <span>Discord</span>
          </div>
        </article>
      </div>
    </div>
  </header>

  <aside class="hint" id="hint">Druk op <kbd>F7</kbd> of type <kbd>/fps</kbd> om het panel te verbergen · geen CPU</aside>

  <script src="script.js"></script>
</body>
</html>
