<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mallorca ELS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel" class="box" aria-hidden="true">
    <div class="box-top">
      <span class="tag">PECHHULP</span>
      <small id="veh">fmltow / dlbrickade</small>
    </div>
    <div id="bar" class="bar" data-mode="off">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="row">
      <button type="button" data-stage="1">1 ACHTER</button>
      <button type="button" data-stage="2">2 ZWAAI</button>
      <button type="button" data-stage="3">3 VOL</button>
    </div>
    <div class="row">
      <button type="button" id="scene">R WERK</button>
      <button type="button" id="siren">G TOON</button>
      <button type="button" data-stage="0">0 UIT</button>
    </div>
    <p id="status">UIT</p>
  </div>
  <div id="gate" class="gate" hidden>
    <p id="gate-text">ELS staat uit. Stap eerst in de fmltow of dlbrickade.</p>
    <button type="button" id="enter">Instappen</button>
    <button type="button" id="exit" hidden>Uitstappen</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
